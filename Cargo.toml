[package]
name = "laralah"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "Laralah"
path = "src/main.rs"

[package.metadata.bundle]
name = "Laralah"
identifier = "app.myanmars.laralah"
icon = ["assets/icons/laralah.icns", "assets/icons/laralah.ico", "assets/icons/laralah.png"]

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.11"
raw-window-handle = "0.6.2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26.0"
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[patch.crates-io]
block = { path = "patches/block" }
proc-macro-error2 = { path = "patches/proc-macro-error2" }
xattr = { path = "patches/xattr" }
