name: "release"

# Push a version tag to build every platform and publish a GitHub release:
#   git tag v0.1.0 && git push origin v0.1.0
# Run it by hand (Actions → release → Run workflow) to build every platform and
# keep the packages as workflow artifacts without creating a release.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # Same check the pre-push hook runs locally: Cargo.toml, Cargo.lock and
        # Info.plist must all agree, and match the tag on tag builds.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release-version.py check --tag "$RELEASE_TAG"
          else
            python3 scripts/release-version.py check
          fi

  prepare-release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.result }}
    steps:
      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) {
              throw new Error(`Release ${tag} is already public; refusing to replace published assets.`);
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Laralah ${tag}`,
                body: 'See the assets to download this version and install.',
                draft: true, prerelease: tag.includes('-'),
              }));
            }
            return release.id;

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64 # Apple Silicon (M1 and above)
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel # Intel Macs (native Intel runner)
            platform: macos-15-intel
            target: x86_64-apple-darwin
          - name: linux-amd64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64 # Native Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64 # Native Windows ARM64
            platform: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev

      - name: Test
        run: cargo test --locked

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Same secrets as Sagar. Tag builds must ship a signed, notarized DMG.
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Missing Apple signing secrets:$missing"
              exit 1
            fi
            echo "::warning::Missing Apple signing secrets:$missing; this manual build is ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/package-macos.sh "${{ matrix.target }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target "${{ matrix.target }}"

      - name: Keep packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laralah-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  upload-release:
    needs: [prepare-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download every platform's packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: laralah-*
          merge-multiple: true

      - name: Upload packages to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

      - name: Publish release after every platform succeeds
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
